<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Program Details - MoonTechLife</title>
  <meta name="description" content="View program overview, structure, curriculum, and registration details for MoonTechLife community programs." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://moontechlife.com/program-detail.html" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://moontechlife.com/program-detail.html" />
  <meta property="og:title" content="Program Details - MoonTechLife" />
  <meta property="og:description" content="View program overview, structure, curriculum, and registration details for MoonTechLife community programs." />
  <meta property="og:image" content="https://moontechlife.com/assets/images/hero-students-transparent.png" />
  <meta property="og:site_name" content="MoonTechLife" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@mtl_community" />
  <meta name="twitter:title" content="Program Details - MoonTechLife" />
  <meta name="twitter:description" content="View program overview, structure, curriculum, and registration details for MoonTechLife community programs." />
  <meta name="twitter:image" content="https://moontechlife.com/assets/images/hero-students-transparent.png" />

  <!-- Favicon / Touch Icons -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="bg-[#FAFAFA] text-[#111624]">

  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <main id="program-detail-container">
    <!-- Dynamic Program Content Loaded Here -->
  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Modal -->
  <div id="modal-placeholder"></div>

  <!-- Scripts -->
  <script type="module">
    import { renderNavbar } from '/src/components/Navbar.js';
    import { renderFooter } from '/src/components/Footer.js';
    import { renderRegistrationModal } from '/src/components/RegistrationModal.js';
    import { programs, getProgramById } from '/src/data/programs.js';
    import '/src/scripts/main.js';

    document.getElementById('navbar-placeholder').innerHTML = renderNavbar('programs');
    document.getElementById('footer-placeholder').innerHTML = renderFooter();
    document.getElementById('modal-placeholder').innerHTML = renderRegistrationModal();

    // Parse URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const programId = urlParams.get('id') || '100days';
    const program = getProgramById(programId);

    // Update Page Title (NO em dashes)
    document.title = `${program.title} - MoonTechLife`;

    // Render Program Detail DOM
    const container = document.getElementById('program-detail-container');
    if (container) {
      container.innerHTML = `
        <!-- HERO BANNER (CLEAN & STRAIGHTFORWARD) -->
        <section class="relative overflow-hidden ${program.heroBg || 'bg-[#FEF3D6]'} border-b border-black/5 py-14 lg:py-20">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <!-- Breadcrumbs / Back Navigation -->
            <div class="mb-6">
              <a href="programs.html" class="inline-flex items-center gap-2 text-xs font-semibold text-gray-600 hover:text-[#111624] transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                <span>Back to All Programs</span>
              </a>
            </div>

            <div class="space-y-6">
              <!-- Badges -->
              <div class="flex items-center gap-2.5 flex-wrap">
                <span class="px-3.5 py-1 rounded-full text-xs font-semibold bg-white text-gray-800 shadow-sm border border-black/5">
                  ${program.badge}
                </span>
                
                <!-- Status Indicator -->
                <span class="px-3.5 py-1 rounded-full text-xs font-semibold ${program.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-white/90 text-gray-700'} shadow-sm flex items-center gap-1.5 border border-black/5">
                  <span class="w-2 h-2 rounded-full ${program.isActive ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}"></span>
                  <span>${program.status}</span>
                </span>

                <span class="px-3.5 py-1 rounded-full text-xs font-medium bg-white text-gray-700 flex items-center gap-1.5 shadow-sm border border-black/5">
                  <svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2"/>
                  </svg>
                  <span>${program.details.duration}</span>
                </span>
              </div>

              <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-[#111624] tracking-tight leading-tight max-w-3xl">
                ${program.title}
              </h1>

              <p class="text-base sm:text-lg text-gray-700 max-w-2xl leading-relaxed">
                ${program.description}
              </p>

              <div class="flex flex-wrap items-center gap-4 pt-2">
                <button data-action="register" data-course-id="${program.id}" data-course-title="${program.title}"
                        class="px-8 py-3.5 rounded-full bg-[#111624] hover:bg-[#232938] text-white text-sm font-semibold transition-all shadow-md hover:shadow-lg flex items-center gap-2">
                  <span>${program.ctaText}</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                  </svg>
                </button>

                <a href="programs.html" 
                   class="px-6 py-3.5 rounded-full bg-white/80 hover:bg-white text-[#111624] text-sm font-medium border border-black/10 transition-all shadow-sm">
                  Explore Other Programs
                </a>
              </div>
            </div>
          </div>
        </section>

        <!-- MAIN TWO-COLUMN CONTENT -->
        <section class="py-16 md:py-24 bg-white">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-16 items-start">
              
              <!-- Left Column: About, Expectation, Audience, Learn -->
              <div class="lg:col-span-8 space-y-12">
                
                <!-- About the Program -->
                <div class="space-y-4">
                  <h2 class="text-2xl font-bold text-[#111624]">About the Program</h2>
                  <p class="text-sm sm:text-base text-gray-700 leading-relaxed">
                    ${program.about}
                  </p>
                </div>

                <!-- What Participants Can Expect -->
                <div class="space-y-4">
                  <h2 class="text-2xl font-bold text-[#111624]">What You Can Expect</h2>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    ${program.whatToExpect.map(item => `
                      <div class="flex items-start gap-3 p-4 rounded-2xl bg-[#FAFAFA] border border-gray-100">
                        <div class="w-5 h-5 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0 mt-0.5">
                          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                          </svg>
                        </div>
                        <span class="text-xs sm:text-sm text-gray-700 font-medium">${item}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <!-- Who It Is For -->
                <div class="space-y-4">
                  <h2 class="text-2xl font-bold text-[#111624]">Who It Is For</h2>
                  <ul class="space-y-2.5">
                    ${program.whoIsThisFor.map(item => `
                      <li class="flex items-start gap-3 text-xs sm:text-sm text-gray-700">
                        <span class="text-[#9B7641] font-bold mt-0.5">•</span>
                        <span>${item}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <!-- What You Will Learn / Experience -->
                <div class="space-y-4">
                  <h2 class="text-2xl font-bold text-[#111624]">What You Will Gain</h2>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    ${program.whatYouWillLearn.map(item => `
                      <div class="p-4 rounded-2xl bg-[#F9F9FB] border border-gray-100 flex items-start gap-3">
                        <span class="text-[#9B7641] font-bold">✓</span>
                        <span class="text-xs sm:text-sm text-gray-700 font-medium">${item}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>

              </div>

              <!-- Right Column: Program Details Sidebar -->
              <div class="lg:col-span-4">
                <div class="sticky top-24 bg-[#FAFAFA] rounded-3xl p-6 sm:p-7 border border-[#EAE8E3] space-y-6">
                  <div>
                    <h3 class="text-lg font-bold text-[#111624] mb-1">Program Overview</h3>
                    <p class="text-xs text-gray-500">Key details for participants</p>
                  </div>

                  <div class="space-y-3.5 text-xs sm:text-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 sm:gap-4 py-2.5 border-b border-gray-200/70">
                      <span class="text-gray-500 font-medium">Status</span>
                      <span class="font-bold ${program.isActive ? 'text-emerald-600' : 'text-amber-600'} sm:text-right">${program.status}</span>
                    </div>

                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-1 sm:gap-4 py-2.5 border-b border-gray-200/70">
                      <span class="text-gray-500 font-medium shrink-0">Duration</span>
                      <span class="font-bold text-[#111624] sm:text-right">${program.details.duration}</span>
                    </div>

                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-1 sm:gap-4 py-2.5 border-b border-gray-200/70">
                      <span class="text-gray-500 font-medium shrink-0">Format</span>
                      <span class="font-bold text-[#111624] sm:text-right leading-snug">${program.details.format}</span>
                    </div>

                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-1 sm:gap-4 py-2.5 border-b border-gray-200/70">
                      <span class="text-gray-500 font-medium shrink-0">Participation</span>
                      <span class="font-bold text-[#111624] sm:text-right leading-snug">${program.details.participation}</span>
                    </div>

                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-1 sm:gap-4 py-2.5">
                      <span class="text-gray-500 font-medium shrink-0">Eligibility</span>
                      <span class="font-bold text-[#111624] sm:text-right leading-snug">${program.details.eligibility}</span>
                    </div>
                  </div>

                  <div class="pt-2">
                    <button data-action="register" data-course-id="${program.id}" data-course-title="${program.title}"
                            class="w-full py-3.5 px-6 rounded-full bg-[#111624] hover:bg-[#232938] text-white text-xs sm:text-sm font-semibold transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                      <span>${program.ctaText}</span>
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </section>

        <!-- BOTTOM CTA BANNER -->
        <section class="py-20 bg-[#FAFAFA] border-t border-[#EAE8E3] text-center">
          <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
            <h2 class="text-3xl sm:text-4xl font-extrabold text-[#111624] tracking-tight">
              Ready to Join MoonTechLife Programs?
            </h2>
            <p class="text-sm sm:text-base text-gray-600 max-w-xl mx-auto leading-relaxed">
              Connect with fellow learners, take on real challenges, and grow your tech career together.
            </p>
            <div class="pt-2">
              <button data-action="register" data-course-id="${program.id}" data-course-title="${program.title}"
                      class="inline-flex items-center justify-center px-8 py-3.5 rounded-full bg-[#111624] hover:bg-[#232938] text-white text-sm font-medium shadow-md hover:shadow-lg transition-all">
                ${program.ctaText}
              </button>
            </div>
          </div>
        </section>
      `;
    }
  </script>
</body>
</html>
